on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build-and-publish-hyperkube-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: gardener/cc-utils/.github/actions/oci-auth@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
        with:
          oci-image-reference: europe-docker.pkg.dev/gardener-project/releases/hyperkube
      - uses: gardener/cc-utils/.github/actions/trusted-checkout@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
      - uses: gardener/cc-utils/.github/actions/setup-git-identity@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0
      - name: build-and-publish-hyperkube-images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .ci/check-and-release
