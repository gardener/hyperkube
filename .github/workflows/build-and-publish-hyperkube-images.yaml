on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  build-and-publish-hyperkube-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: gardener/cc-utils/.github/actions/oci-auth@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
        with:
          oci-image-reference: europe-docker.pkg.dev/gardener-project/releases/hyperkube
      - uses: gardener/cc-utils/.github/actions/trusted-checkout@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
      - uses: gardener/cc-utils/.github/actions/setup-git-identity@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build-and-publish-hyperkube-images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .ci/check-and-release
